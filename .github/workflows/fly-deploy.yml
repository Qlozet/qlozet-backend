# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
  # Manual trigger — redeploy from the Actions tab without pushing a commit
  # (e.g. after a transient Fly builder outage).
  workflow_dispatch:
jobs:
  # Money-path flow tests gate the deploy: a broken payment/cancel/dispute
  # flow must never reach production. (~30s incl. the cached mongod binary.)
  test:
    name: Flow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}
      - run: npm ci
      - run: npm run test:flows

  deploy:
    name: Deploy app
    needs: test
    runs-on: ubuntu-latest
    # Serialises deploys. Do NOT add `cancel-in-progress: true` here: with
    # `--remote-only` the build and any release machine run inside Fly, so
    # cancelling the GitHub job kills only the local flyctl client and leaves
    # that remote work running. You can end up with two mutating maintenance
    # runs racing on the same database, or a rollout abandoned with machines on
    # mixed images. Queueing is the safe behaviour.
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Depot (Fly's default remote builder) has transient outages that fail
      # with "timed out connecting to machine / authentication handshake
      # failed". When that happens, retry once on the classic Fly builder
      # instead of stranding the release.
      - run: |
          flyctl deploy --remote-only || {
            echo "::warning::Depot build failed - retrying with the classic Fly builder"
            flyctl deploy --remote-only --depot=false
          }
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
