# fly.toml app configuration file generated for qlozet-backend-staging on 2026-11-13T06:31:19Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'qlozet-backend-staging'
primary_region = 'lhr'

[build]
[env]
  PORT = '5000'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
